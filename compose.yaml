services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boss_forge
      POSTGRES_USER: boss_forge
      POSTGRES_PASSWORD: boss_forge_dev
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss_forge -d boss_forge"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - boss_forge_postgres:/var/lib/postgresql/data

volumes:
  boss_forge_postgres:
